services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sba
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: sba
    ports: ["5432:5432"]
    volumes: ["sba_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sba -d sba"]
      interval: 5s
      timeout: 3s
      retries: 10
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://sba:localdev@db:5432/sba
      NODE_ENV: production
      PORT: "8080"
      SHAREPOINT_MODE: live
      ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  sba_pgdata:
